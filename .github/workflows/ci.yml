name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-windows:
    runs-on: windows-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: auto
    defaults:
      run:
        working-directory: cmd/go-alexa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache-dependency-path: cmd/go-alexa/go.sum
      - name: Check Windows credential permissions and CLI lifecycle
        run: go test -race ./...
      - name: Build and vet standalone CLI
        run: |
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
      - name: Check CLI module metadata
        run: |
          go mod tidy -diff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod verify
  verify:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: auto
      GOLANGCI_LINT: golangci-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify generated client and wire models
        run: |
          make generate
          go run ./tools/apiroutes --check
          go run ./tools/modelinventory -check
          go run ./tools/openapibundle -check
          generated_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$generated_status" ]; then
            echo "Regeneration changed files or produced untracked artifacts:"
            echo "$generated_status"
            exit 1
          fi
      - name: Check module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Validate canonical schema examples
        run: make schema-examples
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files -- '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files: $unformatted"
            exit 1
          fi
      - name: Run golangci-lint gate
        run: make lint
      - name: Build and race tests
        run: make check
      - name: Check non-generated library coverage
        run: |
          go test -race -coverpkg=./pkg/... -coverprofile=coverage.out ./pkg/...
          go run ./tools/coverage -profile coverage.out -min 80
