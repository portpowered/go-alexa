name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated client and wire models
        run: |
          make generate
          git diff --exit-code -- pkg/dependencies/graphql/generated.go pkg/dependencies/rest/internal/wire/models.gen.go pkg/alexa/internal/wire
      - name: Check module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files -- '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files: $unformatted"
            exit 1
          fi
      - name: Lint, build, and race tests
        run: make check
      - name: Check non-generated library coverage
        run: |
          go test -race -coverpkg=./pkg/... -coverprofile=coverage.out ./pkg/...
          go run ./tools/coverage -profile coverage.out -min 80
