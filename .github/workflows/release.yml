name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: auto
      GOLANGCI_LINT: golangci-lint
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      PUBLIC_MODULE: github.com/portpowered/go-alexa
      PUBLIC_PACKAGES: pkg/alexa,pkg/alexaapimodels,pkg/dependencymodels
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated wire artifacts on the tag
        run: |
          make generate
          go run ./tools/apiroutes --check
          go run ./tools/modelinventory -check
          go run ./tools/openapibundle -check
          generated_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$generated_status" ]; then
            echo "Regeneration changed files or produced untracked artifacts:"
            echo "$generated_status"
            exit 1
          fi
      - name: Check non-generated coverage on the tag
        run: |
          go test -race -coverpkg=./pkg/... -coverprofile=coverage.out ./pkg/...
          go run ./tools/coverage -profile coverage.out -min 80
      - name: Install pinned golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run golangci-lint gate on the tag
        run: make lint
      - name: Check public API compatibility and release version
        env:
          VERSION: ${{ github.ref_name }}
        run: go run ./tools/compatibility -policy release -base previous-release -version "$VERSION" -module "$PUBLIC_MODULE" -packages "$PUBLIC_PACKAGES"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Verify tagged module from a public-proxy consumer
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$check_dir"' EXIT
          cd "$check_dir"
          go mod init example.com/module-check
          module_ready=false
          for attempt in {1..12}; do
            if go get "${PUBLIC_MODULE}@${VERSION}"; then
              module_ready=true
              break
            fi
            echo "Module not available through proxy.golang.org yet (attempt ${attempt}/12)"
            sleep 10
          done
          if [ "$module_ready" != true ]; then
            echo "Could not fetch the tagged module from proxy.golang.org after twelve attempts."
            exit 1
          fi
          cat > main.go <<EOF
          package main

          import (
              "context"
              "${PUBLIC_MODULE}/pkg/alexa"
              "${PUBLIC_MODULE}/pkg/alexaapimodels"
              dependencymodels "${PUBLIC_MODULE}/pkg/dependencymodels"
          )

          var _ interface {
              ListEndpoints(context.Context, alexaapimodels.EndpointQuery) (*alexaapimodels.UnifiedEndpointListResponse, error)
          } = (*alexa.Session)(nil)

          var _ dependencymodels.Endpoint = (*alexaapimodels.Endpoint)(nil)
          var _ = dependencymodels.FriendlyNameValue{
              Type: "text",
              Value: dependencymodels.FriendlyNameText{Text: "release-check"},
          }
          var _ = dependencymodels.BrightnessControlRequest{
              BaseFeatureRequest: dependencymodels.BaseFeatureRequest{EndpointID: "release-check"},
          }

          func main() {
              client, _ := alexa.NewClient()
              session, _ := client.NewSession(alexa.WithBearerToken("release-check"))
              defer session.Close()
          }
          EOF
          go mod tidy
          go test ./...
  publish:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          if [ "$VERSION" = "v0.4.0" ]; then
            cat >> "$notes_file" <<'NOTES'
          Review the [upgrade guide](https://portpowered.github.io/go-alexa/docs/guides/upgrading/) before updating from v0.3. Nested dependency types and event payload types changed; action durations are now strings.

          NOTES
          fi
          cat >> "$notes_file" <<EOF
          Provider contracts remain implementation-derived. See [verification guidance](https://github.com/$REPOSITORY/blob/$VERSION/docs/verification.md) for the available evidence.
          EOF
          gh release create "$VERSION" --repo "$REPOSITORY" --verify-tag --generate-notes \
            --notes-file "$notes_file"
