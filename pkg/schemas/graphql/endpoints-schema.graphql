# Combined schema for endpoint operations
# This schema combines the necessary types from the reference schemas

scalar Long
scalar JSON
scalar DateTime
scalar EndpointId

schema {
  query: Query
  mutation: Mutation
}

type Query {
  listEndpoints(listEndpointsInput: ListEndpointsInput!): ListEndpointsResponse!
  endpoints(endpointsQueryParams: EndpointsQueryParams): EndpointsResponse
  endpoint(id: String!): Endpoint
}

type Mutation {
  setEndpointFeatures(setEndpointFeaturesInput: SetEndpointFeaturesInput!): SetEndpointFeaturesResponse
  requestEndpointQualityOfService(qualityOfServiceInput: EndpointQualityOfServiceInput!): EndpointQualityOfServiceResponse!
  subscribe(subscribeConfiguration: SubscribeConfiguration!): SubscribeResponse!
}

input EndpointsQueryParams {
  featureLatencyTolerance: FeatureLatencyToleranceValue
  filters: [Filter!]
  paginationParams: PaginationParams
  includeHouseholdDevices: Boolean = false
}

input ListEndpointsInput {
  maxAgeInMillis: Long
  latencyTolerance: LatencyToleranceValue
  displayCategory: String
  allDisplayCategories: String
  enablement: Enablement
  filters: [ListEndpointsFilter]
  filterExpressions: [FilterExpression!]
  queryExpression: JSON
  maxPagesToFetch: Int
  endpointIds: [String]
  paginationParams: PaginationParams
  includeHouseholdDevices: Boolean = false
}

type ListEndpointsResponse {
  endpoints: [Endpoint!]!
  paginationInfo: PaginationInfo
  completeResult: Boolean!
}

type EndpointsResponse {
  items: [Endpoint!]
  paginationInfo: PaginationInfo
}


input ListEndpointsFilter {
  type: ListEndpointsFilterType!
  featureName: FeatureName
  featurePropertyName: FeaturePropertyName
  value: String!
}

enum ListEndpointsFilterType {
  Feature
}

enum FilterOperatorOptions {
  EQ
}

input Filter {
  key: String!
  operator: FilterOperatorOptions = EQ
  value: String!
}

input FilterExpression {
  filterKey: String!
  filterValue: String!
}

type Endpoint {
  id: String!
  parentComponent: Endpoint
  childComponents: [Endpoint!]!
  endpointId: String!
  legacyIdentifiers: LegacyIdentifiers
  dmsIdentifier: DmsInfo
  description: NameValueObject
  manufacturer: NameValueObject
  friendlyName: String
  friendlyNameObject: NameValueObject
  model: NameValueObject
  serialNumber: NameValueObject
  softwareVersion: NameValueObject
  creationTime: DateTime
  associatedUnits: [Unit]
  associateUnits: String
  alexaEnabledMetadata: AlexaEnabledMetadata
  isEnabled: Boolean
  displayCategories: DisplayCategories
  enablement: Enablement
  connections: [Connection]
  features(latencyToleranceValue: LatencyToleranceValue): [Feature]
  operations: [EndpointOperation]
  endpointReports: [EndpointReport!]!
  legacyAppliance: LegacyAppliance
}

type AlexaEnabledMetadata {
  category: String
  iconId: String!
