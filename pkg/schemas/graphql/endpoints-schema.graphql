# SetEndpointFeatures mutation types
input SetEndpointFeaturesInput {
  featureControlRequests: [FeatureControlRequest!]!
}

input FeatureControlRequest {
  entityId: String
  endpointId: String
  featureName: FeatureName!
  instance: String
  featureOperationName: FeatureOperationName!
  payload: JSON
}

enum FeatureOperationName {
  #powerState & toggle
  turnOn
  turnOff
  
  #volume
  setVolume
  adjustVolume
  
  #brightness
  setBrightness
  adjustBrightness
  
  #percentage
  setPercentage
  adjustPercentage
  
  #powerLevel
  setPowerLevel
  adjustPowerLevel
  
  #color
  setColor
  
  #colorTemperature
  setColorTemperature
  increaseColorTemperature
  decreaseColorTemperature
  
  # thermostat
  setTargetSetpoint
  setThermostatMode
  adjustTargetSetpoint
  
  # lock
  lock
  unlock

  # Commissionable
  reportCommissioningInformation
  # mode
  setMode
  adjustMode
  # range
  setRangeValue
  adjustRangeValue
  
  # Action
  performAction

  # FabricManagement
  listFabrics
  removeFabric
  
}


type SetEndpointFeaturesResponse {
  featureControlResponses: [FeatureControlResponse!]!
  errors: [FeatureControlError!]!
}

type FeatureControlResponse {
  endpointId: String!
  featureName: FeatureName!
  instance: String
  featureOperationName: FeatureOperationName!
  payload: JSON
  code: String!
  responsePayload: FeatureResponsePayload
}

type FeatureControlError {
  endpointId: String!
  featureName: FeatureName!
  instance: String
  featureOperationName: FeatureOperationName!
  payload: JSON
  code: String!
  message: String
}

interface FeatureResponsePayload {
  type: FeaturePayloadType
}

enum FeaturePayloadType {
  CommissioningInformationReport
  FabricList
  FabricRemoval
}

type CommissioningInformationReport implements FeatureResponsePayload {
  type: FeaturePayloadType
  value: CommissioningInformationReportValue
}

type CommissioningInformationReportValue {
  commissioningInformation: [CommissioningInformation!]
}

interface CommissioningInformation {
  localProtocol: String
}

type MatterCommissioningInformation implements CommissioningInformation {
  localProtocol: String
  protocolData: MatterProtocolData!
}

type MatterProtocolData {
  manualPairingCode: String!
  commissioningWindowExpirationTimestamp: String!
}

type FabricList implements FeatureResponsePayload {
  type: FeaturePayloadType
  maxSupportedFabrics: Int!
  currentFabricCount: Int!
  fabrics: [FabricDetail!]
}

type FabricDetail {
  label: String!
  fabricIndex: Int!
  fabricId: String!
  vendorId: Int!
  isRemovable: Boolean!
}

type FabricRemoval implements FeatureResponsePayload {
  type: FeaturePayloadType
  fabric: RemoveFabricDetail!
}

type RemoveFabricDetail {
  fabricIndex: Int!
  fabricId: String!
  vendorId: Int!
}

# Quality of Service mutation types
input EndpointQualityOfServiceInput {
  endpoints: [EndpointId!]!
  configuration: QualityOfServiceConfiguration!
}

input QualityOfServiceConfiguration {
  typeOfExperience: QualityOfServiceExperience!
  durationInSeconds: Int
}

type EndpointQualityOfServiceResponse {
  durationInSeconds: Int
  errors: [ErrorResponse]
}

enum QualityOfServiceExperience {
  BACKGROUND_EPHEMERAL
  BACKGROUND_PERSISTENT
  FOREGROUND_PERSISTENT
}

# Subscribe mutation types
input SubscribeConfiguration {
  format: SubscriptionEventFormat!
  entities: [SubscriptionFilter!]
  reset: Boolean
  version: String
  durationInMinutes: Int
}

enum SubscriptionEventFormat {
  Default
  GraphQL
}

input SubscriptionFilter {
  entityType: String!
  ids: [String!]
}

type SubscribeResponse {
  entities: [String!]
  errors: [ErrorResponse!]
  durationInMinutes: Int
}

