info:
  description: |
    This is an implementation-derived description of HTTP routes, request shapes,
    and response models used by the current go-alexa source. It is not an
    Amazon-issued API contract. There are no sanitized live HTTP captures in
    this repository, so these shapes have not been verified against current
    service behavior. Synthetic test data is not evidence of provider behavior.
    See the Alexa AsyncAPI document for the directive stream parsed by the
    library, and the GraphQL schema for its GraphQL subset.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Alexa HTTP APIs used by go-alexa
  version: 0.1.0
openapi: 3.0.3
paths:
  /ap/exchangetoken/cookies:
    post:
      description: |
        The client sends this request to `https://api.{domain}` with an
        `x-amzn-identity-auth-domain` header. The body and returned cookies
        contain authentication material. The caller-provided domain is not
        validated by the library.
      operationId: exchangeRefreshTokenForCookies
      parameters:
      - description: Set by the cookie exchange implementation to `api.{domain}`.
        in: header
        name: x-amzn-identity-auth-domain
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WireCookieExchangeRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireCookieExchangeResponse'
          description: Cookie collection decoded by the current helper.
        default:
          $ref: '#/components/responses/UnhandledResponse'
      security: []
      servers:
      - url: https://api.{domain}
        variables:
          domain:
            default: amazon.com
            description: Domain supplied to the cookie exchange method.
      summary: Exchange a refresh token for cookies
      tags:
      - Account linking
  /ap/oa:
    get:
      description: |
        go-alexa exports regional authorization URLs using this path. The
        library does not dispatch this request; callers direct an account
        holder to the URL and add authorization query values. The path is
        implementation-derived and is not a provider-verified OAuth contract.
      operationId: openAuthorizationPage
      responses:
        default:
          description: Browser navigation response is not decoded by go-alexa.
      security: []
      servers:
      - url: https://api.amazon.com
        x-go-alexa-region: na
      - url: https://api.amazon.co.uk
        x-go-alexa-region: eu
      - url: https://api.amazon.co.jp
        x-go-alexa-region: jp
      summary: Start caller-managed account authorization
      tags:
      - Account linking
  /api/behaviors/preview:
    post:
      description: |
        The sequence itself is JSON encoded into the `sequenceJson` string.
        The library sets `behaviorId` to `PREVIEW` and `status` to `ENABLED`.
        This describes serialization in the source, not the service's current
        acceptance rules.
      operationId: submitBehaviorPreview
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WireBehaviorPreviewRequest'
        required: true
      responses:
        "200":
          description: The implementation accepts a successful response without decoding
            a body.
        default:
          $ref: '#/components/responses/UnhandledResponse'
      security:
      - BearerToken: []
      - CookieHeader: []
      servers:
      - url: https://alexa.amazon.com
      - url: https://alexa.amazon.co.uk
      - url: https://alexa.amazon.co.jp
      summary: Submit a behavior preview sequence
      tags:
      - Behaviors
  /api/devices-v2/device:
    get:
      description: |
        The REST helper sends either a bearer authorization header or a cookie
        header. A supplied CSRF option is serialized as a `Cookie` header.
        The response model is based on the Go fields currently decoded by the
        client and is not verified against a live response.
      operationId: listFirstPartyDevices
      parameters:
      - description: The helper can send this value in its Cookie header.
        in: header
        name: csrf
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireDevicesV2Response'
          description: Device list decoded by the current helper.
        default:
          $ref: '#/components/responses/UnhandledResponse'
      security:
      - BearerToken: []
      - CookieHeader: []
      servers:
      - url: https://alexa.amazon.com
      - url: https://alexa.amazon.co.uk
      - url: https://alexa.amazon.co.jp
      summary: List first-party device records
      tags:
      - First-party devices
  /api/language:
    get:
      description: |
        This helper sends its stored cookies and checks the response cookies
        for a cookie named `csrf`. It does not decode the response body or
        validate a provider status code in this path.
      operationId: fetchCsrfCookie
      responses:
        "200":
