asyncapi: 3.0.0
info:
  title: Alexa directive stream consumed by go-alexa
  version: 0.1.0
  description: |
    Implementation-derived description of the directive stream parser in
    `pkg/alexa/http2.go` and `pkg/alexa/client_event.go`. The repository has no
    sanitized live stream captures. The synthetic parser tests do not prove
    current provider behavior, wire media type, boundary syntax, or event
    frequency. This document records the shapes required by the current
    implementation and is not an Amazon-issued protocol specification.
servers:
  northAmerica:
    host: alexa.na.gateway.devices.a2z.com
    x-go-alexa-region: na
    protocol: https
    protocolVersion: '2'
    description: Default stream authority in go-alexa.
  europe:
    host: alexa.eu.gateway.devices.a2z.com
    x-go-alexa-region: eu
    protocol: https
    protocolVersion: '2'
    description: EU stream authority constant in go-alexa.
  japan:
    host: alexa.fe.gateway.devices.a2z.com
    x-go-alexa-region: jp
    protocol: https
    protocolVersion: '2'
    description: Japan stream authority constant in go-alexa.
channels:
  directives:
    address: /v20160207/directives
    x-go-alexa-stream-framing:
      description: |
        Implementation-derived parser configuration. No sanitized live capture
        in this repository verifies the response framing or boundary syntax.
      line-delimiter: "\n"
      trim-whitespace: true
      boundary-prefix: "------"
      content-type-prefix: "Content-Type:"
      skip-empty-lines: true
      authentication-failure-marker: "Unable to authenticate the request. Please provide a valid authorization token."
    servers:
      - $ref: '#/servers/northAmerica'
      - $ref: '#/servers/europe'
      - $ref: '#/servers/japan'
    messages:
      directiveLine:
        $ref: '#/components/messages/DirectiveLine'
operations:
  receiveDirectives:
    action: receive
    channel:
      $ref: '#/channels/directives'
    summary: Receive parsed directive lines from a long-lived response
    tags:
      - name: Event stream
    description: |
      The client opens an HTTP/2 GET using bearer authentication, reads the
      response line by line, skips boundary-like lines beginning with
      `------` and `Content-Type:` lines, and attempts to decode each remaining
      line as a JSON directive. The exact response framing is not verified.
    messages:
      - $ref: '#/channels/directives/messages/directiveLine'
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      description: Sent in the Authorization header by the HTTP/2 client.
  messages:
    DirectiveLine:
      name: DirectiveLine
      title: JSON directive line accepted by the current parser
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DirectiveMessage'
      description: |
        This is the JSON object shape required by `ParseEvent`. It is a parser
        input description; no captured service message in this repository has
        verified that the provider currently emits this shape.
  schemas:
    DirectiveMessage:
      type: object
      properties:
        directive:
          $ref: '#/components/schemas/Directive'
          x-go-wire-key-constant-name: EventDirectiveKey
      required: [directive]
      additionalProperties: true
    Directive:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/DirectiveHeader'
          x-go-wire-key-constant-name: EventHeaderKey
        payload:
          $ref: '#/components/schemas/DirectivePayload'
          x-go-wire-key-constant-name: EventPayloadKey
      required: [header, payload]
      additionalProperties: true
    DirectiveHeader:
      type: object
      description: The current parser reads `messageId`; it does not validate other header fields.
      properties:
        namespace: {type: string}
        name: {type: string}
        messageId:
          type: string
          x-go-wire-key-constant-name: EventMessageIDKey
      additionalProperties: true
    DirectivePayload:
      type: object
      properties:
        renderingUpdates:
          type: array
          x-go-wire-key-constant-name: EventRenderingUpdatesKey
          items:
            $ref: '#/components/schemas/RenderingUpdate'
      required: [renderingUpdates]
      additionalProperties: true
    RenderingUpdate:
      type: object
      properties:
        route: {type: string}
        resourceId: {type: string}
        resourceMetadata:
          type: string
          x-go-wire-key-constant-name: EventResourceMetadataKey
          description: JSON text which the parser decodes as a ResourceMetadata document.
          contentMediaType: application/json
          contentSchema:
            $ref: './feature-events.yaml#/components/schemas/ResourceMetadataPayload'
      required: [resourceMetadata]
      additionalProperties: true
